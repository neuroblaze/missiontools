<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>missiontools — 3D Visualization</title>
<script>
var CESIUM_BASE_URL = "Cesium/";
var MISSIONTOOLS_CZML = null;
</script>
<script src="Cesium/Cesium.js"></script>
<script src="Cesium/cesium-sensor-volumes.js"></script>
<link href="Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
html, body, #cesiumContainer {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: #000;
}
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<script>
(function() {
    var czmlData = MISSIONTOOLS_CZML;

    Cesium.TileMapServiceImageryProvider.fromUrl(
        Cesium.buildModuleUrl("Assets/Textures/NaturalEarthII"),
        { maximumLevel: 2 }
    ).then(function(provider) {
        var viewer = new Cesium.Viewer("cesiumContainer", {
            baseLayer: new Cesium.ImageryLayer(provider),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: true,
            sceneModePicker: true,
            navigationHelpButton: false,
            animation: true,
            timeline: true,
            fullscreenButton: false,
            infoBox: true,
            selectionIndicator: true,
        });

        viewer.scene.globe.enableLighting = true;

        if (czmlData) {
            viewer.dataSources.add(
                Cesium.CzmlDataSource.load(czmlData)
            ).then(function(ds) {
                viewer.zoomTo(ds);
            });
        }
    });
})();
</script>
</body>
</html>
